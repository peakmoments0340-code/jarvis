<!doctype html>
<html>
  <head>

    <title>Jarvis - Personal Assistant</title>

      body { font-family: Arial, sans-serif; margin: 1rem; }
      #log { height: 60vh; overflow:auto; border: 1px solid #ccc; padding: 8px; }

    </style>
  </head>

    </div>

    <script src="renderer.js"></script>

</html>
