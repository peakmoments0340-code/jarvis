<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jarvis</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --accent: #22c55e;
        --accent-2: #3b82f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Segoe UI, Arial, sans-serif;
        background: linear-gradient(180deg, #020817, #0f172a);
        color: var(--text);
      }
      .wrap { padding: 20px; }
      h2 {
        margin: 0 0 16px;
        color: #f8fafc;
      }
      .status {
        display: inline-block;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
      }
      #log {
        height: 60vh;
        overflow: auto;
        background: rgba(15,23,42,0.9);
        border: 1px solid rgba(148,163,184,0.25);
        border-radius: 10px;
        padding: 12px;
        line-height: 1.5;
      }
      .msg { margin: 6px 0; }
      .user { color: #bfdbfe; }
      .assistant { color: #bbf7d0; }
      .system { color: #fcd34d; }
      .controls {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(148,163,184,0.25);
        background: rgba(15,23,42,0.8);
        color: var(--text);
      }
      button {
        border: none;
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--accent-2);
        color: white;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary { background: #334155; }
      button.warn { background: #16a34a; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>Jarvis</h2>
      <div class="status" id="status">Checking backend...</div>
      <div id="log"></div>
      <div class="controls">
        <input id="input" placeholder="Try: 'open notepad' or 'What is the weather in Lagos?" />
        <button id="send">Send</button>
        <button id="voice" class="secondary">🎙 Voice</button>
        <button id="speak" class="warn">🔊 Speak</button>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
